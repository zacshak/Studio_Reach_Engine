name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet Pillow==12.2.0
      - run: python -m unittest discover -s Claude_Lead_Discovery_Engine/tests -p 'test_*.py'
      - run: python -m unittest discover -s EpicGamesScraper/tests -p 'test_*.py'
      - run: python -m unittest discover -s HermesScraper -p 'test_*.py'
      - run: python -m unittest discover -s Leads_Reviewer -p 'test_*.py'
      - run: python -m unittest discover -s Mail_Sender -p 'test_*.py'
      - run: python Leads_Reviewer/sprite_sheet.py --selftest
      - run: node --test webapp/worker.test.js
