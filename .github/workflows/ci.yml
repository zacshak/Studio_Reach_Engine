name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --quiet Pillow==12.2.0 dnspython==2.7.0
      - run: python -m unittest discover -s Claude_Lead_Discovery_Engine/tests -p 'test_*.py'
      - run: python -m unittest discover -s EpicGamesScraper/tests -p 'test_*.py'
      - run: python -m unittest discover -s HermesScraper -p 'test_*.py'
      - run: python -m unittest discover -s Leads_Reviewer -p 'test_*.py'
      - run: python -m unittest discover -s Mail_Sender -p 'test_*.py'
      - run: python -m unittest discover -s Email_Verifier/tests -p 'test_*.py'
      - run: python Leads_Reviewer/sprite_sheet.py --selftest
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: node --test webapp/*.test.js
      - run: npm ci --ignore-scripts
        working-directory: db-mcp
      - run: npm test
        working-directory: db-mcp
