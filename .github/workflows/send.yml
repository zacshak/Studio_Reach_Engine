name: Send mails

# Sends the approved (Mail_status='Scheduled') cold mails from Gmail, paced 2-4 min apart.
# Started by the dashboard's Send button, and automatically by the dashboard worker's cron
# (webapp/autosend.js) whenever approved mails wait and an account's rolling 24h cap has
# room. Only mails you approved are sent, so outbound always has a human gate. Cloud send reads each
# draft from its R2 manifest and purges the lead's R2 media after a successful send.
on:
  workflow_dispatch:
    inputs:
      check_accounts:
        description: Only log in to each sending account (SMTP + IMAP) and record the result. Sends nothing.
        type: boolean
        default: false

concurrency:
  group: send                  # never overlap two send runs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # safety ceiling — a full paced batch can run a while.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet libsql==0.1.11 boto3==1.43.22 cryptography==50.0.1 google-auth==2.62.2 google-api-python-client==2.202.0
      - name: Service account key file (Gmail API)
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          if [ -n "$GOOGLE_SA_KEY" ]; then
            umask 077
            printf '%s' "$GOOGLE_SA_KEY" > "$RUNNER_TEMP/google-sa-key.json"
            echo "GOOGLE_SA_KEY_FILE=$RUNNER_TEMP/google-sa-key.json" >> "$GITHUB_ENV"
          fi
      - name: Send scheduled mails
        env:
          SEND_TIME_BUDGET_SECONDS: "19800" # stop between mails before the 350-minute runner ceiling
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_ACCOUNTS: ${{ secrets.SENDER_ACCOUNTS }}
          MS_TOKEN_KEY: ${{ secrets.MS_TOKEN_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CHECK_ACCOUNTS: ${{ inputs.check_accounts }}
        run: |
          if [ "$CHECK_ACCOUNTS" = "true" ]; then
            python -u Mail_Sender/mailer.py --check-accounts
          else
            python -u SRE.py --send-mails
          fi
