name: Send mails

# Sends the approved (Mail_status='Scheduled') cold mails from Gmail, paced 2-4 min apart.
# NOT scheduled — fired on demand by the app's "Send approved mails"
# button (Mail-Approval section) so outbound always has a human gate. Cloud send reads each
# draft from its R2 manifest and purges the lead's R2 media after a successful send.
on:
  workflow_dispatch: {}

concurrency:
  group: send                  # never overlap two send runs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # safety ceiling — a full paced batch can run a while.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet libsql==0.1.11 boto3==1.43.22 dnspython==2.7.0
      - name: Send scheduled mails
        env:
          SEND_TIME_BUDGET_SECONDS: "19800" # stop between mails before the 350-minute runner ceiling
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          QEV_API_KEY: ${{ secrets.QEV_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u SRE.py --send-mails
