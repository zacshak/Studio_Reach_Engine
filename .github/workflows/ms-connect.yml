name: Connect Microsoft mailbox

# One-time browser sign-in for a Microsoft 365 sending account:
#   1. open the link from `python Mail_Sender/ms_oauth.py --auth-url MAILBOX` (or leave
#      signed_in_address empty: this run prints the link) and sign in AS THAT MAILBOX;
#   2. the browser ends on a blank .../nativeclient?code=... page: copy the whole address;
#   3. run this workflow with that address as signed_in_address within ~10 minutes.
# The single-use code is masked in the log; the refresh token is stored encrypted (MS_TOKEN_KEY).
on:
  workflow_dispatch:
    inputs:
      email:
        description: Mailbox to connect (must be a microsoft row in sender_accounts)
        type: string
        required: true
      signed_in_address:
        description: The whole address bar after signing in (.../nativeclient?code=...). Empty = print the sign-in link
        type: string
        required: false
        default: ""

concurrency:
  group: ms-connect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet libsql==0.1.11 boto3==1.43.22 cryptography==50.0.1
      - name: Sign-in link (when no address was given)
        if: ${{ inputs.signed_in_address == '' }}
        env:
          EMAIL: ${{ inputs.email }}
        run: |
          echo "Open this link in a private window and sign in as $EMAIL:"
          python -u Mail_Sender/ms_oauth.py --auth-url "$EMAIL"
          echo "Then run this workflow again with the final address as signed_in_address."
      - name: Store the token from the signed-in address
        if: ${{ inputs.signed_in_address != '' }}
        env:
          EMAIL: ${{ inputs.email }}
          SIGNED_IN: ${{ inputs.signed_in_address }}
          MS_TOKEN_KEY: ${{ secrets.MS_TOKEN_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          echo "::add-mask::$SIGNED_IN"
          python -u Mail_Sender/ms_oauth.py --redeem "$EMAIL" "$SIGNED_IN"
      - name: Check SMTP and IMAP login for every sending account
        if: ${{ inputs.signed_in_address != '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_ACCOUNTS: ${{ secrets.SENDER_ACCOUNTS }}
          MS_TOKEN_KEY: ${{ secrets.MS_TOKEN_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -u Mail_Sender/mailer.py --check-accounts
