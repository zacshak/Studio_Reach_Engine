name: check scheduled emails (temporary)
on:
  push:
    branches: [claude/gifted-planck-qayhpu]
    paths: [.github/workflows/check-scheduled.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --quiet libsql==0.1.11 dnspython==2.7.0
      - env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          QEV_API_KEY: ${{ secrets.QEV_API_KEY }}
          ABSTRACT_API_KEY: ${{ secrets.ABSTRACT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "."); sys.path.insert(0, "Claude_Lead_Discovery_Engine")
          import pipeline
          from Email_Verifier import EmailVerifier
          v = EmailVerifier.from_env()
          for appid, raw in pipeline.mail_status_emails("Scheduled"):
              email = pipeline.normalize_email(raw)
              r = pipeline.get_email_verification(email) or v.verify(email)
              if r.get("result") in ("valid", "invalid"):
                  pipeline.cache_email_verification(email, r)
              print(appid, email, r.get("result"), r.get("reason"), r.get("source"))
          PY
