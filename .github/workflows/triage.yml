name: Triage

# Runs after Nightly discovery, or manually with no inputs. Triage reads the current
# `scrape_tracker` Pending set from Turso and its manifests/images from R2 directly.
on:
  workflow_run:
    workflows: ["Nightly discovery"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: triage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  triage:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet libsql==0.1.11 boto3==1.43.22 openai==2.43.0
      - name: Triage -> flag irrelevant into R2 (vision model)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TRIAGE_BASE_URL: ${{ secrets.TRIAGE_BASE_URL }}
          TRIAGE_MODEL: ${{ secrets.TRIAGE_MODEL }}
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python Claude_Lead_Discovery_Engine/triage_cloud.py
