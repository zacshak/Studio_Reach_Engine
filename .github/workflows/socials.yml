name: Hermes socials

# Enrich user-requested games after drafting, while their R2 review media still exists.
# Manual dispatch handles ReqSocial choices made from the Mail view after drafting.
on:
  workflow_run:
    workflows: ["Draft mails"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: hermes-socials
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  socials:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --quiet libsql==0.1.11 openai==2.43.0 playwright==1.60.0
          playwright install --with-deps chromium
      - name: Search and store requested socials
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TRIAGE_BASE_URL: ${{ secrets.TRIAGE_BASE_URL }}
          TRIAGE_MODEL: ${{ secrets.TRIAGE_MODEL }}
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
        run: python -u SRE.py --scrape-socials
