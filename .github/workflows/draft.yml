name: Draft mails

# AI-drafts cold mails for accepted leads awaiting one (Mail_status='Writing'), writing each
# into the lead's R2 manifest so the app's Mail-Approval section can show it. NOT scheduled —
# fired on demand by the app's "Draft pending mails" button. Idempotent: skips leads that
# already have a draft.
on:
  workflow_dispatch: {}

concurrency:
  group: draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # safety ceiling — a rate-limited free key may wait it out.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet libsql boto3 openai
      - name: Draft mails -> R2 manifests
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TRIAGE_BASE_URL: ${{ secrets.TRIAGE_BASE_URL }}
          TRIAGE_MODEL: ${{ secrets.TRIAGE_MODEL }}
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python SRE.py --draft-mails
