name: Draft mails

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify real image inference and JSON without drafting leads
        type: boolean
        default: false
      check_models:
        description: Optional JSON array of route IDs to audit with synthetic images (check_only only)
        type: string
        default: ""

concurrency:
  group: draft
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet libsql==0.1.11 boto3==1.43.22 openai==2.43.0
      - name: Verify vision endpoint and draft mails
        env:
          CHECK_ONLY: ${{ inputs.check_only }}
          CHECK_MODELS: ${{ inputs.check_models }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MAIL_WRITER_BASE_URL: ${{ secrets.MAIL_WRITER_BASE_URL }}
          MAIL_WRITER_MODEL: ${{ secrets.MAIL_WRITER_MODEL }}
          MAIL_WRITER_API_KEY: ${{ secrets.MAIL_WRITER_API_KEY }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            if [ -n "$CHECK_MODELS" ]; then
              python -u Mail_Sender/audit_vision.py
            else
              python -u Mail_Sender/draft_cloud.py --check-only
            fi
          else
            python -u SRE.py --draft-mails
          fi
