name: Nightly discovery

# Runs the discovery pipeline in the cloud each morning so fresh, reviewable leads are
# waiting in Turso + R2 without your PC being on. Ephemeral runner: all state lives in
# Turso (DB) and R2 (media); nothing on the runner survives.
on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC ≈ 06:30 IST daily (GitHub cron is UTC)
  workflow_dispatch: {}        # manual "Run workflow" button — use this to test first

concurrency:
  group: discover              # never overlap two discovery runs
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # libsql ships Linux wheels for 3.12
      - name: Install deps
        run: pip install --quiet openpyxl Pillow libsql boto3
      - name: Discover -> stage -> mirror to R2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python SRE.py --discover
