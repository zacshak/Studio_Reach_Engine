name: Nightly discovery

# Runs the discovery pipeline in the cloud each morning so fresh, reviewable leads are
# waiting in Turso + R2 without your PC being on. Triage reads `scrape_tracker` directly.
on:
  schedule:
    - cron: "30 22 * * *"    # 22:30 UTC = 04:00 IST daily (GitHub cron is UTC)
  workflow_dispatch: {}        # manual "Run workflow" button — use this to test first

concurrency:
  group: discover              # never overlap two discovery runs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # near GitHub's 6h hard cap; a safety ceiling, not runtime.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"   # libsql ships Linux wheels for 3.12
      - name: Install deps
        run: pip install --quiet openpyxl==3.1.5 Pillow==12.2.0 libsql==0.1.11 boto3==1.43.22
      - name: Discover -> stage -> mirror to R2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python SRE.py --discover
