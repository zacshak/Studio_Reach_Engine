name: tmp live check
on:
  push:
    branches: [claude/gifted-planck-qayhpu]
    paths: [.github/workflows/tmp-live-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --quiet libsql==0.1.11 cryptography==50.0.1 boto3==1.43.22 google-auth==2.62.2 google-api-python-client==2.202.0
      - name: read-only checks (no DB writes)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          SENDER_ACCOUNTS: ${{ secrets.SENDER_ACCOUNTS }}
          MS_TOKEN_KEY: ${{ secrets.MS_TOKEN_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          cd Mail_Sender && python - <<'PY'
          import imaplib
          from unittest.mock import patch
          import mailer, pipeline
          _, boxes = mailer.load_accounts()
          by = {b.email.lower(): b for b in boxes}
          rows = pipeline._ro().execute("SELECT s.appid,s.game_name,s.emails,a.message_id,a.started_at,a.sender FROM scrape_tracker s JOIN mail_send_attempt a ON a.appid=s.appid WHERE s.appid IN (5528290,5546980,4009790,3468040,5576280)").fetchall()
          print("== 1. Reply check on Gmail-hosted mailboxes (games already marked Replied; write stubbed)")
          for appid, name, email, mid, started, sender in rows:
              acct = by[sender.lower()]
              with patch.object(pipeline, "set_mail_status") as st:
                  n = mailer._review_mailbox(acct, [(appid, email, mid, started)])
              print(f"  {name} [{sender}]: replies found={n}, would mark={[c.args for c in st.call_args_list]}")
          print("== 2. Sent recovery search on Outlook (FixIt's sent mail; no DB write)")
          for appid, name, email, mid, started, sender in rows:
              if not sender.endswith("xrevise.cc"): continue
              acct = by[sender.lower()]
              imap = imaplib.IMAP4_SSL(acct.imap, timeout=30); acct.imap_login(imap)
              typ, folders = imap.list()
              import re
              sent = next(m.group(1).decode() for f in folders if (m := re.match(rb'\([^)]*\\Sent\b[^)]*\)\s+(?:"[^"]*"|NIL)\s+(.+)', f, re.I)))
              imap.select(sent, readonly=True)
              typ, d = imap.search(None, "TO", f'"{mailer._recipient(email)}"', "SINCE", mailer._imap_since(started))
              hit = mailer._has_message_id(imap, d[0].split(), mid)
              wrong = mailer._has_message_id(imap, d[0].split(), "<not-ours@xrevise.cc>")
              print(f"  {name} [{sender}] in {sent}: candidates={d[0].split()}, exact Message-ID found={hit}, fake ID found={wrong}")
              imap.logout()
          PY
