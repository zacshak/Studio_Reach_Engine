name: compare verifier vs QEV (temporary)
on:
  push:
    branches: [claude/gifted-planck-qayhpu]
    paths: [.github/workflows/compare-qev.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet libsql==0.1.11 dnspython==2.7.0
      - env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          QEV_API_KEY: ${{ secrets.QEV_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -u .github/probe/compare_qev.py
