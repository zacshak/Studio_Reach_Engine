name: Epic discovery

on:
  schedule:
    - cron: "30 22 * * *" # 22:30 UTC = 04:00 IST daily
  workflow_dispatch: {}

concurrency:
  group: epic-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Epic dependencies
        run: pip install --quiet libsql==0.1.11
      - name: Discover Epic upcoming games
        env:
          EPIC_TURSO_DATABASE_URL: ${{ secrets.EPIC_TURSO_DATABASE_URL }}
          EPIC_TURSO_AUTH_TOKEN: ${{ secrets.EPIC_TURSO_AUTH_TOKEN }}
          EPIC_TURSO_REQUIRED: "1"
        run: python EpicGamesScraper/discover_epic.py
