name: Review replies

# Nightly: check every 'Sent' lead's address against the Gmail inbox (IMAP, read-only) and
# flip the ones who replied to 'Replied'. Cheap and safe — only the DB status changes, no
# mail is sent. Also fireable on demand.
on:
  schedule:
    - cron: "30 18 * * *"      # 18:30 UTC = 00:00 IST daily (GitHub cron is UTC)
  workflow_dispatch: {}

concurrency:
  group: review-mails
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet libsql==0.1.11 dnspython==2.7.0
      - name: Check bounces, then Sent leads for replies
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_ACCOUNTS: ${{ secrets.SENDER_ACCOUNTS }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python SRE.py --review-mails
