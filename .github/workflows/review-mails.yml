name: Review replies

# Nightly: check every 'Sent' lead's address against the Gmail inbox (IMAP, read-only) and
# flip the ones who replied to 'Replied'. Cheap and safe — only the DB status changes, no
# mail is sent. Also fireable on demand.
on:
  schedule:
    - cron: "30 18 * * *"      # 18:30 UTC = 00:00 IST daily (GitHub cron is UTC)
  workflow_dispatch: {}

concurrency:
  group: review-mails
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet libsql==0.1.11
      - name: Check Sent leads for replies
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python SRE.py --review-mails
