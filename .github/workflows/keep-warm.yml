name: Keep app warm

# Free Streamlit Community Cloud apps sleep when idle; the first visit then waits ~30-60s
# to wake. A periodic HTTP ping keeps it warm so the morning review is instant.
on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the Streamlit app
        run: curl -fsS -m 90 https://studioreachengine.streamlit.app/ -o /dev/null && echo "pinged ok"
