name: tmp gmail verify
on:
  push:
    branches: [claude/gifted-planck-qayhpu]
    paths: [.github/workflows/tmp-gmail-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --quiet libsql==0.1.11 cryptography==50.0.1 google-auth==2.62.2 google-api-python-client==2.202.0
      - name: key
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          if [ -n "$GOOGLE_SA_KEY" ]; then
            umask 077; printf '%s' "$GOOGLE_SA_KEY" > "$RUNNER_TEMP/google-sa-key.json"
            echo "GOOGLE_SA_KEY_FILE=$RUNNER_TEMP/google-sa-key.json" >> "$GITHUB_ENV"; echo "key secret: present"
          else echo "key secret: MISSING"; fi
      - name: verify
        env:
          SENDER_ACCOUNTS: ${{ secrets.SENDER_ACCOUNTS }}
          MS_TOKEN_KEY: ${{ secrets.MS_TOKEN_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set +e
          echo "== 1. getProfile"; python -u Mail_Sender/gmail_api.py --check; C=$?
          if [ $C = 0 ]; then echo "== 2. thread test"; python -u Mail_Sender/gmail_api.py --thread-test meshak@thaswin.com meshakzac@thaswin.com; else echo "== 2. thread test SKIPPED (check failed)"; fi
          echo "== 3. app password inboxes"
          python -u Mail_Sender/mailer.py --check-mailbox meshak@zacgamedev.com
          python -u Mail_Sender/mailer.py --check-mailbox meshak@xrevise.cc
          echo "== 4. workspace inboxes with an app password in SENDER_ACCOUNTS (names only)"
          WS=$(python -c "
          import json,os,sys; sys.path.insert(0,'Mail_Sender'); import gmail_api
          d=json.loads(os.environ.get('SENDER_ACCOUNTS') or '{}')
          print(' '.join(k.lower() for k in d if gmail_api.workspace(k)))")
          echo "found: ${WS:-none}"
          for box in $WS; do
            python - "$box" <<'PY'
          import json,sys
          p='Mail_Sender/mail_backends.json'; c=json.load(open(p)); c['mailboxes'][sys.argv[1]]={'backend':'app_password'}
          json.dump(c,open(p,'w'),indent=2)
          PY
            echo "-- $box default was gmail_api; config switched to app_password:"
            python -u Mail_Sender/mailer.py --check-mailbox "$box"
            break
          done
          exit 0
