name: Kimchi scrape

# Same job as Hermes (find one recruiting email per pending studio) but done by the kimchi
# CLI (getkimchi/kimchi) as a FULLY-AGENTIC scraper: it drives Playwright itself and records
# results through KimchiScraper/kimchi_db.py. Standalone (KimchiScraper/) — shares no code
# with Hermes, so either can be deleted wholesale after the A/B evaluation.
#
# Trigger: AUTOMATIC after "Triage" succeeds (no button). Manual run also here.
on:
  workflow_run:
    workflows: ["Triage"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: kimchi                  # never overlap two kimchi runs (they share the queue)
  cancel-in-progress: false

permissions:
  contents: read                 # only checks out the repo; all DB writes go to Turso

jobs:
  kimchi:
    # after triage: only if it succeeded; the manual button always runs
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75          # job ceiling; the agent step below has its own 60-min cap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install kimchi CLI + Playwright (headless Chromium) + DB deps
        run: |
          mkdir -p "$HOME/.local"
          curl -fsSLo "$RUNNER_TEMP/kimchi.tar.gz" https://github.com/getkimchi/kimchi/releases/download/v0.1.90/kimchi_linux_amd64.tar.gz
          echo "176f18d4cec511fa75ba9e3a0c6bb9c7639f4d72060ce3501cf96cf91471d310  $RUNNER_TEMP/kimchi.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kimchi.tar.gz" -C "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install --quiet libsql==0.1.11 playwright==1.60.0
          playwright install --with-deps chromium
      - name: Run kimchi agent over the pending queue
        # Hard cap: on 2026-07-02 the agent drained the queue but never exited and idled
        # ~4h toward the old 350-min ceiling. 60 min is generous for a nightly queue
        # (~15-30 leads); and a timeout loses nothing anyway — writes are incremental
        # (one per appid as it goes) and unfinished leads stay 'pending', so the next
        # night's run resumes exactly where this one stopped.
        timeout-minutes: 60
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
        # -p one-shot & exit · --auto run freely but keep the classifier guard (no dangerous
        # ops) · --no-session ephemeral · --model pins minimax-m3.
        run: |
          kimchi -p --auto --no-session --model minimax-m3 "$(cat KimchiScraper/kimchi_task.md)"
          # reap any orphaned headless browsers the agent left behind — a leftover child
          # holding the step's output pipes is the classic way a finished job hangs
          pkill -f chromium || true
