name: Kimchi scrape

# Same job as Hermes (find one recruiting email per pending studio) but done by the kimchi
# CLI (getkimchi/kimchi) as a FULLY-AGENTIC scraper: it drives Playwright itself and records
# results through KimchiScraper/kimchi_db.py. Standalone (KimchiScraper/) — shares no code
# with Hermes, so either can be deleted wholesale after the A/B evaluation.
#
# Trigger: AUTOMATIC after "Nightly discovery" succeeds (no button). Manual run also here.
on:
  workflow_run:
    workflows: ["Nightly discovery"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: kimchi                  # never overlap two kimchi runs (they share the queue)
  cancel-in-progress: false

permissions:
  contents: read                 # only checks out the repo; all DB writes go to Turso

jobs:
  kimchi:
    # after discovery: only if it succeeded; the manual button always runs
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45          # job ceiling; the agent step below has its own 30-min cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kimchi CLI + Playwright (headless Chromium) + DB deps
        env:
          # Force bin+data under $HOME. The runner CAN write /usr/local/bin, so the installer
          # picks it — but its paired /usr/local/share is root-owned, so the data-dir move dies
          # with "Permission denied". Pinning the dir keeps both halves writable.
          KIMCHI_INSTALL_DIR: /home/runner/.local/bin
        run: |
          curl -fsSL https://github.com/getkimchi/kimchi/releases/latest/download/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"   # ensure the kimchi binary is on PATH
          pip install --quiet libsql playwright
          playwright install --with-deps chromium
      - name: Run kimchi agent over the pending queue
        # Hard cap: on 2026-07-02 the agent finished the whole queue in well under 30 min
        # but the process never exited (likely an orphaned headless-Chromium child) and
        # idled ~4h toward the old 350-min ceiling. Writes are incremental (one DB write
        # per appid as it goes), so killing a hung run loses nothing.
        timeout-minutes: 30
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
        # -p one-shot & exit · --auto run freely but keep the classifier guard (no dangerous
        # ops) · --no-session ephemeral · --model pins minimax-m3.
        run: |
          kimchi -p --auto --no-session --model minimax-m3 "$(cat KimchiScraper/kimchi_task.md)"
          # reap any orphaned headless browsers the agent left behind — a leftover child
          # holding the step's output pipes is the classic way a finished job hangs
          pkill -f chromium || true
