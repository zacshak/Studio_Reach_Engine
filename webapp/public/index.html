<!DOCTYPE html>
<!-- SRE review app — the whole frontend. Vanilla JS, no build step.
     Cards advance only after confirmed writes. Queue refresh runs without
     clearing already-loaded media; explicit Refresh reloads all manifests.
     Keyboard: ←/→ navigate · A = accept/approve/keep · R = reject. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRE — Studio Reach Engine</title>
<meta name="description" content="Review game studios and outreach drafts in Studio Reach Engine.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🎮%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e1117; color: #e6e6e6;
         font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap;
           padding: .6rem 1rem; border-bottom: 1px solid #262b36;
           position: sticky; top: 0; background: #0e1117; z-index: 2; }
  header h1 { font-size: 1rem; margin: 0 1rem 0 0; color: #9aa4b2; font-weight: 600; }
  .tab { background: none; border: 1px solid #262b36; color: #9aa4b2; padding: .35rem .8rem;
         border-radius: 999px; cursor: pointer; font-size: .9rem; }
  @media (max-width: 480px) {
    header { flex-wrap: nowrap; overflow-x: auto; padding: .4rem .6rem; gap: .3rem; }
    header h1 { display: none; }
    .tab { padding: .3rem .55rem; font-size: .8rem; flex: none; white-space: nowrap; }
  }
  .tab.on { background: #1b2330; color: #fff; border-color: #3b82f6; }
  .tab b { color: #79adff; }
  main { max-width: 860px; margin: 0 auto; padding: 1rem; padding-bottom: 5.5rem; }
  .banner { background: #7f1d1d; color: #fecaca; padding: .5rem .8rem; border-radius: 8px;
            margin-bottom: .8rem; display: flex; justify-content: space-between; align-items: center; }
  .banner[hidden] { display: none; }   /* display:flex above beats the hidden attr without this */
  .banner button { background: #fecaca; border: 0; border-radius: 6px; padding: .2rem .6rem; cursor: pointer; }
  .empty { text-align: center; color: #9aa4b2; padding: 4rem 0; }
  a { color: #79adff; text-decoration: underline; }
  .card h2 { margin: .2rem 0 .1rem; font-size: 1.3rem; }
  .meta { color: #9aa4b2; font-size: .85rem; margin-bottom: .5rem; }
  .desc { margin: .5rem 0 .8rem; white-space: pre-wrap; }
  .hero { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 10px; background: #161b26;
          object-fit: contain; display: block; }
  .thumbs { display: flex; gap: .4rem; margin-top: .4rem; overflow-x: auto; }
  .thumbs img { width: 92px; height: 52px; object-fit: cover; border-radius: 6px; cursor: pointer; opacity: .75; }
  .thumbs img.on { opacity: 1; outline: 2px solid #3b82f6; }
  .mail { background: #161b26; border: 1px solid #262b36; border-radius: 10px;
          padding: .8rem; margin: .8rem 0; white-space: pre-wrap; font-size: .92rem; }
  .mail .to { color: #34d399; font-size: .85rem; margin-bottom: .5rem; }
  .nav { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: .8rem 0; }
  .nav button { background: #1b2330; color: #e6e6e6; border: 1px solid #262b36;
                border-radius: 8px; padding: .35rem .9rem; cursor: pointer; }
  .nav span { color: #9aa4b2; font-size: .85rem; min-width: 70px; text-align: center; }
  .nav button { min-width: 44px; min-height: 44px; }
  .tab { min-height: 44px; }
  .refresh { min-width: 44px; min-height: 44px; background: #1b2330; color: #e6e6e6; border: 1px solid #52525b; border-radius: 8px; cursor: pointer; }
  #activity { position: fixed; top: 4rem; right: 1rem; z-index: 3; background: #1b2330; color: #e6e6e6; padding: .4rem .7rem; border-radius: 6px; pointer-events: none; }
  #activity:empty { display: none; }
  .actions { display: flex; gap: .6rem; position: fixed; left: 0; right: 0; bottom: 0;
             max-width: 860px; margin: 0 auto; padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom));
             background: #0e1117; border-top: 1px solid #262b36; z-index: 2; }
  .actions button { flex: 1; padding: .7rem; border: 0; border-radius: 10px;
                    font-size: 1rem; cursor: pointer; font-weight: 600; }
  .ok  { background: #14532d; color: #bbf7d0; }
  .bad { background: #7f1d1d; color: #fecaca; }
  .bulk { display: flex; gap: .6rem; margin-top: .8rem; }
  .bulk button { flex: 1; padding: .5rem; border-radius: 8px; border: 1px solid #262b36;
                 background: #161b26; color: #9aa4b2; cursor: pointer; }
  .bulk button.armed { background: #7f1d1d; color: #fecaca; border-color: #ef4444; }
  .bulk.top { margin: 0 0 .8rem; }
  .shotsall img { width: 100%; border-radius: 10px; margin-top: .4rem; display: block; }
</style>
</head>
<body>
<header>
  <h1>SRE review</h1>
  <button class="tab" data-tab="triage">🗑 Triage <b></b></button>
  <button class="tab" data-tab="approval">🎮 Approval <b></b></button>
  <button class="tab" data-tab="mail">📧 Mail <b></b></button>
  <button class="tab" data-tab="nomail">🚫 No-Mail <b></b></button>
  <button class="refresh" onclick="load()" aria-label="Refresh dashboard">↻</button>
</header>
<main>
  <div id="activity" role="status" aria-live="polite"></div>
  <div id="banner" class="banner" hidden>
    <span id="bannerText"></span><button id="retryWrites" onclick="retryFailed()">Retry</button>
  </div>
  <div id="view"></div>
</main>

<script>
"use strict";

const enc = encodeURIComponent;
const $ = (s) => document.querySelector(s);

// Save intent before sending. A lost response stays visible after refresh.
const failed = (() => {
  let value;
  try { value = JSON.parse(localStorage.getItem('sre_pending_writes') || '[]'); } catch { return []; }
  if (!Array.isArray(value)) return [];
  const valid = value.filter(item => Array.isArray(item) && typeof item[0] === 'string' && item[1] && typeof item[1] === 'object');
  const retained = valid.filter(([action, extra]) => action !== 'require_socials' && !(action === 'trigger' && extra.workflow === 'socials'));
  if (retained.length !== valid.length) {
    try { localStorage.setItem('sre_pending_writes', JSON.stringify(retained)); } catch {}
  }
  return retained;
})();
let writeBusy = false;
const pendingCards = new Set();
let cardWrites = Promise.resolve();
let actionNotice = '';
function persistWrites() { localStorage.setItem('sre_pending_writes', JSON.stringify(failed)); }
function showBanner() {
  const unresolved = failed.filter(item => !pendingCards.has(item[1].appid));
  $("#activity").textContent = pendingCards.size ? `Saving ${pendingCards.size} action(s)…` : writeBusy ? 'Saving…' : '';
  $("#banner").hidden = unresolved.length === 0 && !actionNotice;
  $("#retryWrites").hidden = unresolved.length === 0;
  $("#bannerText").textContent = [actionNotice, unresolved.length ? `${unresolved.length} unconfirmed action(s). ${unresolved.at(-1)[2] || 'Retry to confirm the saved action.'}` : ''].filter(Boolean).join(' ');
}
async function api(action, extra = {}) {
  if (writeBusy) return false;
  writeBusy = true;
  // An older refresh must not repaint state captured before this write.
  if (typeof loadGeneration !== 'undefined') loadGeneration++;
  if (!bulkBusy) actionNotice = '';
  const key = JSON.stringify([action, extra]);
  let entry = failed.find(item => JSON.stringify(item.slice(0,2)) === key);
  if (!entry) { entry = [action, extra, 'Request awaiting confirmation']; failed.push(entry); }
  try {
    persistWrites();
    showBanner();
    render();
    const r = await fetch("/api/act", {
      method: "POST",
      signal: AbortSignal.timeout(35000),
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, ...extra }),
    });
    const result = await r.json().catch(() => ({}));
    if (!r.ok || result.ok !== true) throw new Error(result.error || `Server response ${r.status}`);
    failed.splice(failed.indexOf(entry), 1);
    persistWrites();
    if (result.blocked?.length) actionNotice += `Not deleted because currently Sending: ${result.blocked.join(', ')}. Review their current state before trying again. `;
    return result;
  } catch (e) {
    console.error(action, extra, e);
    entry[2] = `${action}: ${e.message}${action === 'trigger' ? '. Check GitHub Actions before starting it again. Workflow dispatch is not automatically retried.' : ''}`;
    try { persistWrites(); } catch {}
    return false;
  } finally {
    writeBusy = false;
    showBanner();
    render();
  }
}
async function retryFailed() {
  if (writeBusy || bulkBusy || pendingCards.size) return;
  for (const [action, extra] of [...failed]) {
    if (action === 'trigger') continue;
    if (!await api(action, extra)) break;
  }
  await load();
}

// ---- state ----
let S = null;                          // /api/state payload
let tab = "triage";
const idx = { triage: 0, approval: 0, mail: 0, nomail: 0 };
const manifests = new Map();           // folder -> manifest (or null while loading)
const manifestTokens = new Map();
let mediaGeneration = 0, loadGeneration = 0, imageRetry = 0;
let renderedHTML = null;
const imageFailures = new Set();
const preloadedImages = new Map();
function invalidateMedia() {
  mediaGeneration++;
  manifests.clear();
  manifestTokens.clear();
  imageFailures.clear();
  preloadedImages.clear();
}
let shot = 0;                          // selected screenshot on current card
let armed = null;                      // two-tap confirm for bulk buttons
let showAll = false;                   // "All N screenshots" toggle on current card

function queues() {
  const mk = (ids) => ids.map((a) => ({ appid: a, folder: S.index[String(a)] }))
                         .filter((c) => c.folder && !pendingCards.has(c.appid))
                         .sort((x, y) => x.folder.toLowerCase() < y.folder.toLowerCase() ? -1 : 1);
  return {
    triage: mk(S.triage),
    approval: mk(S.approval),
    mail: mk(S.mail.map((m) => m.appid)),
    nomail: mk(S.nomail),
  };
}
let Q = null;
const emailsOf = (appid) => (S.mail.find((m) => m.appid === appid) || {}).emails || "";

function refreshError(message, background) {
  if (background && Q) { actionNotice = message; showBanner(); }
  else { renderedHTML = null; $("#view").textContent = message; }
}
async function load({ background = false } = {}) {
  const generation = ++loadGeneration;
  showBanner();
  if (!background || !Q) { renderedHTML = null; $("#view").innerHTML = '<div class="empty">Loading…</div>'; }
  let r;
  try { r = await fetch("/api/state", { signal: AbortSignal.timeout(30000), cache: 'no-store' }); }
  catch (e) { if (generation === loadGeneration) refreshError(`Could not refresh: ${e.message}. Reload to try again. Saved actions are retained.`, background); return; }
  if (generation !== loadGeneration) return;
  if (!r.ok) {
    const error = await r.json().catch(() => ({}));
    if (generation !== loadGeneration) return;
    refreshError(`Could not load data: ${error.error || r.status}`, background);
    return;
  }
  let next;
  try { next = await r.json(); }
  catch { if (generation === loadGeneration) refreshError('Server returned invalid data. Refresh to retry.', background); return; }
  if (generation !== loadGeneration) return;
  if (background && S) {
    // A newly drafted row may have a cached pre-draft manifest. Revalidate it.
    const oldMail = new Set(S.mail.map(row => Number(row.appid)));
    for (const row of next.mail) if (!oldMail.has(Number(row.appid))) {
      const folder = next.index[String(row.appid)];
      manifests.delete(folder);
      manifestTokens.delete(folder);
    }
  } else invalidateMedia();
  S = next;
  Q = queues();
  if (!Q[tab].length) tab = ["triage", "approval", "mail", "nomail"].find((t) => Q[t].length) || tab;
  render();
}

// ---- manifests: fetch on view, prefetch the next card ----
async function manifest(folder) {
  if (!manifests.has(folder)) {
    const generation = mediaGeneration;
    const token = Symbol();
    manifestTokens.set(folder, token);
    manifests.set(folder, null);
    try {
      const r = await fetch(`/media/${enc(folder)}/manifest.json`, { signal: AbortSignal.timeout(25000), cache: 'no-store' });
      if (!r.ok) throw new Error(`Media request failed (${r.status})`);
      const value = await r.json();
      if (generation !== mediaGeneration || manifestTokens.get(folder) !== token) return null;
      manifests.set(folder, value);
    } catch (e) {
      if (generation !== mediaGeneration || manifestTokens.get(folder) !== token) return null;
      manifests.set(folder, { missing: true, error: e.message });
    }
    if (Q?.[tab]?.[idx[tab]]?.folder === folder) render();
  }
  return manifests.get(folder);
}
const PRELOAD_OFFSETS = [1, 2, 3, -1];
function prefetch(list, i) {
  for (const j of PRELOAD_OFFSETS.map(offset => i + offset)) {
    const c = list[j];
    if (!c) continue;
    preloadNeighbor(c.folder);
  }
}
async function preloadNeighbor(folder) {
  const generation = mediaGeneration;
  const m = await manifest(folder);
  if (generation !== mediaGeneration || !Array.isArray(m?.images)) return;
  const current = Q?.[tab] || [];
  if (!PRELOAD_OFFSETS.some(offset => current[idx[tab] + offset]?.folder === folder)) return;
  const name = m.images.find(name => name.includes('SpriteSheet')) || m.images[0];
  if (!name) return;
  const url = imageURL(folder, name);
  if (preloadedImages.has(url)) return;
  const image = new Image();
  image.fetchPriority = 'low';
  image.decoding = 'async';
  preloadedImages.set(url, image);
  // Keep a few image references, not the entire review queue in memory.
  while (preloadedImages.size > 8) preloadedImages.delete(preloadedImages.keys().next().value);
  image.onerror = () => { if (preloadedImages.get(url) === image) preloadedImages.delete(url); };
  image.src = url;
}

// ---- render ----
// GHA buttons live outside the card so they also show when a queue is empty —
// Draft appears exactly then (queue cleared, accepted leads awaiting drafts), and
// Send must survive Approve-all emptying the list. `fired` = per-session spam guard.
const fired = {};
function ghaBtn(label, wf) {
  return fired[wf]
    ? `<button disabled data-unavailable>✓ ${label} — started</button>`
    : `<button ${writeBusy || pendingCards.size || failed.length ? 'disabled' : ''} onclick="fireGha('${wf}')">${label}</button>`;
}
async function fireGha(wf) {
  if (writeBusy || bulkBusy || pendingCards.size || failed.length) return;
  if (await api("trigger", { workflow: wf })) fired[wf] = true;
  render();
}

function paint(view, html) {
  if (renderedHTML !== html) { view.innerHTML = html; renderedHTML = html; }
}
function render() {
  if (!Q) return;
  document.querySelectorAll(".tab").forEach((b) => {
    const t = b.dataset.tab;
    b.classList.toggle("on", t === tab);
    b.querySelector("b").textContent = Q[t].length;
  });
  const list = Q[tab];
  const view = $("#view");
  // drafts are pending when accepted leads ('Writing') have no draft text yet
  const gha =
    (tab === "approval" && !list.length && S.pendingDrafts
      ? ghaBtn("✍️ Draft pending mails", "draft") : "") +
    (tab === "mail" && S.scheduled ? ghaBtn("📨 Send scheduled mails", "send") : "");
  if (!list.length) {
    paint(view, (gha ? `<div class="bulk top">${gha}</div>` : "") +
                     `<div class="empty">${pendingCards.size ? 'Review actions are still saving…' : 'Nothing to review 🎉'}</div>`);
    return;
  }

  idx[tab] = Math.min(idx[tab], list.length - 1);
  const i = idx[tab];
  const card = list[i];
  const m = manifests.get(card.folder);
  if (m === undefined) manifest(card.folder);     // kick off fetch; rerenders when done
  prefetch(list, i);

  const name = (m && m.name) || card.folder.split("_").slice(0, -1).join("_") || card.appid;
  let imgs = (m && m.images) || [];
  // sprite sheet first — same preference as the Streamlit card
  imgs = [...imgs].sort((a, b) => b.includes("SpriteSheet") - a.includes("SpriteSheet"));
  shot = Math.min(shot, Math.max(imgs.length - 1, 0));
  const img = imgs.length
    ? imageTag(card.folder, imgs[shot], 'class="hero" fetchpriority="high"')
    : m?.missing ? `<div class="empty">${escapeHtml(m.error || 'Media unavailable')}<br><button onclick="retryMedia()">Retry images</button></div>` : `<div class="hero"></div>`;
  const thumbs = imgs.length > 1
    ? `<div class="thumbs">${imgs.map((f, k) =>
        imageTag(card.folder, f, `loading="lazy" data-thumb class="${k === shot ? "on" : ""}" onclick="shot=${k};render()"`)).join("")}</div>` : "";
  // "All N screenshots" toggle from the Streamlit card — stacks every image full-width
  const shotsCtl = imgs.length > 1
    ? `<div class="bulk"><button onclick="showAll=!showAll;render()">${
        showAll ? "🖼 Hide screenshots" : `🖼 All ${imgs.length} screenshots`}</button></div>` : "";
  const allShots = showAll
    ? `<div class="shotsall">${imgs.map((f) =>
        imageTag(card.folder, f, 'loading="lazy"')).join("")}</div>` : "";
  const mail = tab === "mail"
    ? `<div class="mail"><div class="to">To: ${escapeHtml(emailsOf(card.appid) || "(no recipient!)")}</div>${
        (m && m.mail) ? escapeHtml(m.mail) : "<i>(not drafted yet)</i>"}</div>` : "";

  const A = { triage: ["✅ Keep", "keep"], approval: ["✅ Accept", "accept"],
              mail: ["✅ Approve", "approve"], nomail: [null, null] }[tab];
  const R = tab === "triage" ? "reject_irrelevant" : "reject";
  // two-tap Reject-all with an explicit Cancel — triage (irrelevant) + no-mail (dead-end leads)
  const bulkTriage = bulkBusy ? `<button disabled>Deleting confirmed batches… ${bulkDone} / ${bulkTotal}</button>` : (tab !== "triage" && tab !== "nomail") ? "" : armed === "bulkR"
    ? `<button class="armed" onclick="bulkReject()">⚠️ Tap again to purge all ${list.length} — can't be undone</button>
       <button onclick="armed=null;render()">Cancel</button>`
    : `<button onclick="bulkReject()">🗑 Reject all (${list.length})</button>`;
  const bulk = bulkTriage +
    (tab === "mail" ? `<button onclick="approveAll()">✅ Approve all (${list.length})</button>` : "") +
    gha;

  // bulk/GHA controls render ABOVE the card — that's where the Streamlit app kept them
  paint(view, `
    ${bulk ? `<div class="bulk top">${bulk}</div>` : ""}
    <div class="card">
      <h2>${escapeHtml(String(name))}</h2>
      <div class="meta">${escapeHtml((m && m.meta) || "")} · appid ${card.appid} ·
        <a href="https://store.steampowered.com/app/${card.appid}/" target="_blank" rel="noopener">Steam page 🔗</a></div>
      ${img}${thumbs}${shotsCtl}${allShots}
      ${tab === 'approval' && m && (!Array.isArray(m.images) || !m.images.includes('SpriteSheet_Screenshots.png')) ? '<p>Drafting unavailable: this game’s screenshot export needs repair.</p>' : ''}
      ${S.triageReviews?.[card.appid] ? `<details><summary>AI recommendation: ${escapeHtml(S.triageReviews[card.appid].decision)}</summary><p>${escapeHtml(S.triageReviews[card.appid].reason || "")}</p><p>Criteria: ${escapeHtml(S.triageReviews[card.appid].criteria || "")}</p></details>` : ""}
      <div class="desc">${m ? escapeHtml(m.desc || "") : "Loading…"}</div>
      ${mail}
      <div class="nav">
        <button aria-label="Previous game" onclick="move(-1)">←</button><span>${i + 1} / ${list.length}</span><button aria-label="Next game" onclick="move(1)">→</button>
      </div>
      <div class="actions">
        ${A[0] ? `<button class="ok" ${tab === 'approval' && (!m || !Array.isArray(m.images) || !m.images.includes('SpriteSheet_Screenshots.png')) ? 'disabled data-unavailable' : ''} onclick="doAct('${A[1]}')">${A[0]}</button>` : ""}
        <button class="bad" onclick="doAct('${R}')">❌ Reject</button>
      </div>
    </div>`);
  view.querySelectorAll('button').forEach(button => {
    const cardAction = button.closest('.actions');
    const globalAction = button.closest('.bulk.top');
    button.disabled = bulkBusy || button.hasAttribute('data-unavailable') ||
      (globalAction && (writeBusy || pendingCards.size > 0 || failed.length > 0)) ||
      (cardAction && ((writeBusy && !pendingCards.size) || failed.some(item => item[1].appid === card.appid)));
  });
}

function imageURL(folder, name, thumbnail = false) {
  const preview = manifests.get(folder)?.previews?.[name];
  const file = (thumbnail ? preview?.thumb : preview?.src) || name;
  return `/media/${enc(folder)}/${enc(file)}${imageRetry ? `?retry=${imageRetry}` : ''}`;
}
function imageTag(folder, name, attributes) {
  const preview = manifests.get(folder)?.previews?.[name];
  const thumbnail = attributes.includes('data-thumb');
  const file = (thumbnail ? preview?.thumb : preview?.src) || name;
  const width = thumbnail ? (preview?.thumb_width || 92) : (preview?.width || 1210);
  const height = thumbnail ? (preview?.thumb_height || 52) : (preview?.height || 686);
  const key = `/media/${enc(folder)}/${enc(file)}`;
  if (imageFailures.has(key)) return `<span role="status">Could not load image: ${escapeHtml(name)} <button onclick="retryMedia()">Retry images</button></span>`;
  return `<img ${attributes} width="${width}" height="${height}" decoding="async" src="${escapeHtml(imageURL(folder, name, thumbnail))}" alt="${escapeHtml(name)}" data-media-key="${escapeHtml(key)}" data-generation="${mediaGeneration}" onerror="imageFailed(this)">`;
}
function imageFailed(image) {
  if (!image.isConnected || Number(image.dataset.generation) !== mediaGeneration || imageFailures.has(image.dataset.mediaKey)) return;
  imageFailures.add(image.dataset.mediaKey);
  render();
}
function retryMedia() {
  const card = Q[tab][idx[tab]];
  if (card) { imageRetry++; invalidateMedia(); render(); }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function move(d) {
  const n = Q[tab].length;
  idx[tab] = (idx[tab] + d + n) % n;
  shot = 0; armed = null; showAll = false;
  render();
}

// Persist intent before advancing. Serialize writes, not user navigation.
async function doAct(action) {
  if (bulkBusy || (writeBusy && !pendingCards.size)) return;
  const card = Q[tab][idx[tab]];
  if (!card || pendingCards.has(card.appid) || failed.some(item => item[1].appid === card.appid)) return;
  const entry = [action, { appid: card.appid }, 'Queued for saving'];
  failed.push(entry);
  try { persistWrites(); }
  catch (e) {
    failed.splice(failed.indexOf(entry), 1);
    actionNotice = `Could not save action locally: ${e.message}. Nothing was submitted.`;
    showBanner(); return;
  }
  pendingCards.add(card.appid);
  loadGeneration++;
  Q = queues();
  shot = 0; armed = null; showAll = false;
  showBanner(); render();
  const saving = cardWrites.then(async () => {
    try {
      const result = await api(action, { appid: card.appid });
      if (result && !result.blocked?.includes(card.appid)) {
        for (const key of ['triage', 'approval', 'nomail']) S[key] = S[key].filter(id => id !== card.appid);
        S.mail = S.mail.filter(row => row.appid !== card.appid);
        if (action === 'accept') S.pendingDrafts = true;
        if (action === 'approve') S.scheduled = true;
      }
    } finally {
      pendingCards.delete(card.appid);
      loadGeneration++;
      Q = queues();
      showBanner(); render();
      if (!pendingCards.size) await load({ background: true });
    }
  });
  // A rendering failure must not strand later persisted actions.
  cardWrites = saving.catch(e => { console.error(e); });
  return saving;
}
async function approveAll() {
  if (writeBusy || bulkBusy || pendingCards.size || failed.length) return;
  const ids = Q.mail.map((c) => c.appid);
  if (await api("approve_all", { appids: ids })) await load();
}
let bulkBusy = false, bulkDone = 0, bulkTotal = 0;
async function bulkReject() {           // Only remove cards after server confirmation.
  if (bulkBusy || writeBusy || pendingCards.size || failed.length) return;
  if (armed !== "bulkR") { armed = "bulkR"; render(); return; }
  const ids = Q[tab].map((c) => c.appid);
  const action = tab === "triage" ? "reject_all_irrelevant" : "reject_all";
  bulkBusy = true; bulkDone = 0; bulkTotal = ids.length; armed = null;
  try {
    for (let i = 0; i < ids.length; i += 10000) {
      const batch = ids.slice(i, i + 10000);
      render();
      const result = await api(action, { appids: batch });
      if (!result) break;
      const removed = new Set(result.deleted ?? batch);
      for (const key of Object.keys(Q)) Q[key] = Q[key].filter(c => !removed.has(c.appid));
      bulkDone += removed.size;
    }
  } finally {
    bulkBusy = false;
    await load({ background: true });
  }
}

// ---- touch swipe (phone navigation, like the Streamlit app) ----
let tx = null, ty = null;
document.addEventListener("touchstart", (e) => {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (tx === null || !Q || !Q[tab].length) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  tx = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;   // tap or scroll
  if (e.target.closest(".thumbs")) return;                        // that strip scrolls sideways
  move(dx < 0 ? 1 : -1);
}, { passive: true });

// ---- tabs + keyboard ----
document.querySelectorAll(".tab").forEach((b) =>
  b.addEventListener("click", () => { tab = b.dataset.tab; shot = 0; armed = null; showAll = false; render(); }));
document.addEventListener("keydown", (e) => {
  if (!Q || !Q[tab].length) return;
  if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "ArrowRight") move(1);
  else if (e.key.toLowerCase() === "a" && ["triage", "approval", "mail"].includes(tab))
    doAct({ triage: "keep", approval: "accept", mail: "approve" }[tab]);
  else if (e.key.toLowerCase() === "r") doAct(tab === "triage" ? "reject_irrelevant" : "reject");
});

load();
</script>
